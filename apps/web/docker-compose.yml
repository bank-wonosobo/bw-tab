services:
    bw-tab-app:
        build:
            context: .
            dockerfile: Dockerfile
            target: production

        image: laravel-inertia-clients:latest
        container_name: bw-tab-app
        restart: unless-stopped

        ports:
            - "7000:80"

        env_file:
            - .env.docker

        environment:
            SERVER_NAME: ":80"
            TZ: Asia/Jakarta

        volumes:
            - laravel-storage:/app/storage

        networks:
            - bw-tab-app-network

        healthcheck:
            test:
                - CMD
                - curl
                - -fsS
                - http://localhost/up
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 30s

volumes:
    laravel-storage:

networks:
    bw-tab-app-network:
        driver: bridge
